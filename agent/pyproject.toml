[project]
name = "ocapp-agent"
version = "0.1.0"
description = "Clone an audio effect from a dry/wet file pair into a Phazerville T4.1 HemisphereAudioApplet"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-ai",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pyloudnorm",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
ocapp-clone = "ocapp_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocapp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
